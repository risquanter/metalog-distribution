name: CI Build + Sigstore provenance

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  # The only lines that differ between risquanter Maven repos:
  ARTIFACT_ID: metalog-distribution
  GROUP_PATH: com/risquanter

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install tools
        run: sudo apt-get update -y && sudo apt-get install -y jq tar gpg xmlstarlet zip


      - name: Import encrypted GPG private-subkey into ephemeral GNUPGHOME
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          # create ephemeral GNUPGHOME for isolation
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"

          # write the armored encrypted blob to a temp file (do not expose to logs)
          TMP_ENC="/tmp/private-subkey.asc.gpg"
          printf '%s' "$GPG_PRIVATE_KEY" > "$TMP_ENC"
          chmod 600 "$TMP_ENC"

          # decrypt the encrypted blob into a temporary plaintext file
          TMP_PLAINT="/tmp/private-subkey.asc"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --decrypt --output "$TMP_PLAINT" "$TMP_ENC"

          # import the plaintext secret subkey into the ephemeral GNUPGHOME
          gpg --batch --import "$TMP_PLAINT"

          # kill agent to ensure allowed settings are applied later if needed
          gpgconf --kill gpg-agent || true

          # discover the signing keyid (first secret key)
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          if [ -z "$KEYID" ]; then
            echo "Failed to determine GPG KEYID"
            shred -u "$TMP_PLAINT" || rm -f "$TMP_PLAINT"
            rm -f "$TMP_ENC"
            exit 1
          fi

          # export GNUPGHOME and KEYID for subsequent steps
          echo "GNUPGHOME=$GNUPGHOME" >> $GITHUB_ENV
          echo "GPG_KEYID=$KEYID" >> $GITHUB_ENV

          # store public key copy for inspection if needed
          gpg --armor --export "$KEYID" > "$GNUPGHOME/publickey.asc"

          # securely delete the plaintext file as soon as possible
          shred -u "$TMP_PLAINT" || rm -f "$TMP_PLAINT"
          rm -f "$TMP_ENC"

          echo "Imported encrypted GPG subkey into ephemeral GNUPGHOME and removed plaintext."



      - name: Build and run tests
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -ntp -Psign clean verify

      - name: Create Maven deployment bundle
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          # Extract version from POM
          VERSION=$(xmlstarlet sel -t -v "/_:project/_:version" pom.xml)
          echo "Detected version: $VERSION"

          # Create Maven repository structure
          BUNDLE_DIR="maven_bundle"
          DEST="$BUNDLE_DIR/$GROUP_PATH/$ARTIFACT_ID/$VERSION"
          mkdir -p "$DEST"

          # Copy artifacts with GPG signatures
          cp target/$ARTIFACT_ID-$VERSION.jar "$DEST/"
          cp target/$ARTIFACT_ID-$VERSION.jar.asc "$DEST/"
          cp target/$ARTIFACT_ID-$VERSION-sources.jar "$DEST/"
          cp target/$ARTIFACT_ID-$VERSION-sources.jar.asc "$DEST/"
          cp target/$ARTIFACT_ID-$VERSION-javadoc.jar "$DEST/"
          cp target/$ARTIFACT_ID-$VERSION-javadoc.jar.asc "$DEST/"

          # Copy Sigstore JSON files
          cp target/$ARTIFACT_ID-$VERSION.jar.sigstore.json "$DEST/"
          cp target/$ARTIFACT_ID-$VERSION-sources.jar.sigstore.json "$DEST/"
          cp target/$ARTIFACT_ID-$VERSION-javadoc.jar.sigstore.json "$DEST/"

          # Copy POM and its signatures. Decision 6A: the pom signature is
          # required, not optional — a missing .asc fails the build here, where
          # the problem starts, instead of shipping an unsigned pom downstream.
          cp pom.xml "$DEST/$ARTIFACT_ID-$VERSION.pom"
          cp target/$ARTIFACT_ID-$VERSION.pom.asc "$DEST/$ARTIFACT_ID-$VERSION.pom.asc"
          cp target/$ARTIFACT_ID-$VERSION.pom.sigstore.json "$DEST/"

          # Generate checksums for Maven Central
          cd "$DEST"
          for file in $ARTIFACT_ID-$VERSION.jar $ARTIFACT_ID-$VERSION-sources.jar $ARTIFACT_ID-$VERSION-javadoc.jar $ARTIFACT_ID-$VERSION.pom; do
            md5sum "$file" | awk '{print $1}' > "$file.md5"
            sha1sum "$file" | awk '{print $1}' > "$file.sha1"
          done
          cd -

          # Hand the layout to later steps (provenance placement, zip).
          {
            echo "VERSION=$VERSION"
            echo "BUNDLE_DIR=$BUNDLE_DIR"
            echo "DEST=$DEST"
          } >> "$GITHUB_ENV"

      - name: Generate SLSA build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'target/${{ env.ARTIFACT_ID }}-${{ env.VERSION }}.jar'

      - name: Ship provenance next to the jar
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # Decision 7B: the SLSA provenance attestation travels to Maven Central
          # next to the jar so a consumer can verify it offline against our
          # pinned workflow identity (cosign verify-blob-attestation
          # --new-bundle-format --type slsaprovenance). The real .sigstore.json
          # signatures come from the Maven signing plugin; this attestation is a
          # separate SLSA statement about how the build ran.
          if [ ! -f "$PROVENANCE_BUNDLE" ]; then
            echo "❌ Attestation bundle not found at $PROVENANCE_BUNDLE"
            exit 1
          fi
          cp "$PROVENANCE_BUNDLE" "$DEST/$ARTIFACT_ID-$VERSION.jar.intoto.jsonl"
          echo "provenance shipped: $DEST/$ARTIFACT_ID-$VERSION.jar.intoto.jsonl"

      - name: Create deployment bundle ZIP
        run: |
          set -euo pipefail
          cd "$BUNDLE_DIR"
          zip -r "../maven-central-artifacts.zip" .
          cd ..
          unzip -l maven-central-artifacts.zip

      - name: Upload Maven deployment bundle
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: deployment-${{ github.run_id }}
          path: maven-central-artifacts.zip
          retention-days: 7

      - name: Cleanup GPG
        if: always()
        run: |
          set +e  # Don't fail on cleanup errors

          if [ -n "${GNUPGHOME:-}" ] && [ -d "${GNUPGHOME}" ]; then
            rm -rf "${GNUPGHOME}"
          fi
          pkill -u "$(id -u)" gpg-agent 2>/dev/null || true

          rm -rf maven_bundle 2>/dev/null
          rm -f maven-central-artifacts.zip 2>/dev/null

          echo "✅ Cleanup completed"
