###############################################################
# Release workflow for the Maven Central Publisher Portal.
#
# Trust model (shared across risquanter repos):
#   1. verify-authorization gates the run on a TOTP code
#      (60-second period, YubiKey OATH credential).
#   2. sign-and-publish then gates on the human-signed release tag:
#      it verifies the SSH-signed tag anchors the exact commit a
#      successful ci-build run was built from, before any bundle is
#      downloaded or uploaded — so a CI or org-secret compromise
#      cannot stage a release the maintainer did not sign.
#   3. It verifies every artifact's Sigstore signature against the
#      ci-build.yml OIDC identity, then uploads to the Central Portal
#      (staged, USER_MANAGED — publishing requires a manual click in
#      the portal), and finally creates the GitHub release.
#
# Required org-level secrets:
#   - TOTP_ORG:                       Base32 secret for TOTP verification
#   - CENTRAL_PORTAL_ORG_TOKEN_NAME:  Central Portal token username part
#   - CENTRAL_PORTAL_ORG_TOKEN:       Central Portal token secret part
#
# For details, see:
#   https://central.sonatype.org/publish/publish-portal-api/
###############################################################

name: Release (Maven Central Publisher Portal, GPG-signed)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run ID to release'
        required: true
      totp_code:
        description: 'TOTP code from your authenticator app'
        required: true

permissions:
  contents: write
  id-token: write

env:
  # The only lines that differ between risquanter Maven repos:
  ARTIFACT_ID: metalog-distribution
  GROUP_PATH: com/risquanter

jobs:
  verify-authorization:
    runs-on: ubuntu-latest
    steps:
      # TOTP is verified with preinstalled python3 (RFC 6238: HMAC-SHA1, 6
      # digits, base32 secret, 60s step — oathtool's defaults). Nothing is
      # installed first, so verification runs seconds after the runner boots
      # and the code cannot age out of its window before it is checked.
      - name: Verify TOTP
        env:
          TOTP_SECRET: ${{ secrets.TOTP_ORG }}
          INPUT_TOTP: ${{ inputs.totp_code }}
        run: |
          set -euo pipefail
          date --utc
          python3 - <<'PY'
          import base64, hashlib, hmac, os, struct, sys, time

          key = base64.b32decode(os.environ["TOTP_SECRET"].strip().replace(" ", "").upper())
          provided = os.environ["INPUT_TOTP"].strip()
          STEP = 60

          def totp(counter: int) -> str:
              digest = hmac.new(key, struct.pack(">Q", counter), hashlib.sha1).digest()
              offset = digest[-1] & 0x0F
              code = (struct.unpack(">I", digest[offset:offset + 4])[0] & 0x7FFFFFFF) % 1_000_000
              return f"{code:06d}"

          counter = int(time.time()) // STEP
          # Accept the current 60s window and the two prior ones so that runner
          # startup and dispatch latency cannot reject an otherwise-valid code.
          if any(hmac.compare_digest(provided, totp(counter - back)) for back in (0, 1, 2)):
              print("✅ TOTP verified successfully")
          else:
              print("❌ Invalid TOTP code")
              sys.exit(1)
          PY

  sign-and-publish:
    needs: verify-authorization
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      actions: read

    env:
      ARTIFACT_RUN_ID: ${{ inputs.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq tar gpg xmlstarlet

      - name: Verify signed release tag anchors the ci-build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "❌ run_id must be a numeric run ID, got: $ARTIFACT_RUN_ID"
            exit 1
          fi

          VERSION=$(xmlstarlet sel -t -v "/_:project/_:version" pom.xml)
          case "$VERSION" in
            *SNAPSHOT*) echo "❌ Refusing to release SNAPSHOT version $VERSION"; exit 1 ;;
          esac
          TAG_NAME="v$VERSION"

          # The maintainer creates and pushes the signed tag locally with their
          # hardware SSH key before dispatching this release. CI never creates
          # the tag; it verifies that the human-signed tag anchors the exact
          # commit the ci-build run was built from, and gates the whole release
          # on that check before any bundle is downloaded or uploaded. A full CI
          # + org-secret compromise cannot forge this tag.
          git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/allowed_signers"

          # Resolve the run, and confirm it is a successful CI Build run before
          # trusting its head SHA. The Sigstore identity check later pins the
          # artifacts to ci-build.yml@main; this pins the run itself.
          RUN_JSON=$(gh run view "$ARTIFACT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json headSha,conclusion,workflowName)
          RUN_SHA=$(echo "$RUN_JSON" | jq -r .headSha)
          RUN_CONCLUSION=$(echo "$RUN_JSON" | jq -r .conclusion)
          RUN_WORKFLOW=$(echo "$RUN_JSON" | jq -r .workflowName)
          if [ -z "$RUN_SHA" ] || [ "$RUN_SHA" = "null" ]; then
            echo "❌ Could not resolve head SHA for run $ARTIFACT_RUN_ID"
            exit 1
          fi
          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "❌ Run $ARTIFACT_RUN_ID did not conclude successfully (conclusion: $RUN_CONCLUSION)"
            exit 1
          fi
          if [ "$RUN_WORKFLOW" != "CI Build + Sigstore provenance" ]; then
            echo "❌ Run $ARTIFACT_RUN_ID is not a CI Build run (workflow: $RUN_WORKFLOW)"
            exit 1
          fi

          # Fetch the pushed tag and confirm it points at that exact commit.
          git fetch --force origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          TAG_SHA=$(git rev-list -n1 "$TAG_NAME")
          if [ "$TAG_SHA" != "$RUN_SHA" ]; then
            echo "❌ Tag $TAG_NAME points at $TAG_SHA but run $ARTIFACT_RUN_ID was built from $RUN_SHA"
            exit 1
          fi

          # Verify the tag signature against the committed allowed_signers file.
          git tag -v "$TAG_NAME"
          echo "✅ Signed tag $TAG_NAME verified and anchors run $ARTIFACT_RUN_ID"

      - name: Download Maven deployment bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "❌ run_id must be a numeric run ID, got: $ARTIFACT_RUN_ID"
            exit 1
          fi
          gh run download "$ARTIFACT_RUN_ID" \
            --name "deployment-$ARTIFACT_RUN_ID" \
            --dir /tmp/maven-release \
            --repo "$GITHUB_REPOSITORY"

      - name: Extract and verify artifacts
        run: |
          set -euo pipefail

          # Extract version from POM
          VERSION=$(xmlstarlet sel -t -v "/_:project/_:version" pom.xml)
          echo "Detected version: $VERSION"

          # Extract the Maven bundle
          cd /tmp/maven-release
          unzip -q maven-central-artifacts.zip -d /tmp/maven-deployment-contents

          JAR_PATH="/tmp/maven-deployment-contents/$GROUP_PATH/$ARTIFACT_ID/$VERSION"
          echo "Looking for JARs in: $JAR_PATH"
          ls -la "$JAR_PATH"

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Verify Sigstore signatures
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          set -euo pipefail

          VERSION=$(xmlstarlet sel -t -v "/_:project/_:version" pom.xml)
          JAR_PATH="/tmp/maven-deployment-contents/$GROUP_PATH/$ARTIFACT_ID/$VERSION"

          echo "Verifying Sigstore signatures..."

          # Exact identity match, identical to register's consumer-side pin: a
          # build from any other branch/workflow/repo is rejected here, not only
          # later by register. The GPG (.asc) signatures are not verified here;
          # Maven Central's keyserver validation is the effective GPG control,
          # and this Sigstore identity check is the binary-authenticity control.

          # Verify each JAR file against its Sigstore signature
          cd "$JAR_PATH"
          for jar in $ARTIFACT_ID-*.jar; do
            if [[ -f "${jar}.sigstore.json" ]]; then
              echo "Verifying $jar..."
              cosign verify-blob --bundle "${jar}.sigstore.json" \
                --certificate-identity="https://github.com/${{ github.repository }}/.github/workflows/ci-build.yml@refs/heads/main" \
                --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
                "$jar"
              echo "✅ $jar signature verified"
            else
              echo "❌ Missing sigstore.json for $jar"
              exit 1
            fi
          done

          # Verify POM file signature
          POM_FILE="$ARTIFACT_ID-$VERSION.pom"
          if [[ -f "${POM_FILE}.sigstore.json" ]]; then
            echo "Verifying $POM_FILE..."
            cosign verify-blob --bundle "${POM_FILE}.sigstore.json" \
              --certificate-identity="https://github.com/${{ github.repository }}/.github/workflows/ci-build.yml@refs/heads/main" \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
              "$POM_FILE"
            echo "✅ $POM_FILE signature verified"
          else
            echo "❌ Missing sigstore.json for $POM_FILE"
            exit 1
          fi

          echo "✅ All JAR and POM signatures verified successfully"

      - name: Deploy to Maven Central Publisher Portal
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_ORG_TOKEN_NAME }}
          CENTRAL_PORTAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_ORG_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(xmlstarlet sel -t -v "/_:project/_:version" pom.xml)
          echo "Deploying version: $VERSION"

          # Use the pre-built Maven bundle
          mkdir -p target
          cp /tmp/maven-release/maven-central-artifacts.zip target/

          echo "Bundle structure:"
          unzip -l target/maven-central-artifacts.zip

          # Upload to Central Portal using REST API
          echo "Uploading to Central Portal..."
          BEARER_TOKEN=$(printf "%s:%s" "${CENTRAL_PORTAL_USERNAME}" "${CENTRAL_PORTAL_TOKEN}" | base64 -w 0)

          HTTP_CODE=$(curl -sS -o /tmp/upload-response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${BEARER_TOKEN}" \
            -F "bundle=@target/maven-central-artifacts.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=${ARTIFACT_ID}-${VERSION}&publishingType=USER_MANAGED")

          UPLOAD_RESPONSE=$(cat /tmp/upload-response.txt)
          if [ "$HTTP_CODE" != "201" ]; then
            echo "❌ Upload failed with HTTP $HTTP_CODE:"
            echo "$UPLOAD_RESPONSE"
            exit 1
          fi

          # On success the response body is the deployment ID (a UUID)
          DEPLOYMENT_ID=$(echo "$UPLOAD_RESPONSE" | tr -d '[:space:]')
          if ! echo "$DEPLOYMENT_ID" | grep -qE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "❌ Unexpected upload response (not a deployment ID):"
            echo "$UPLOAD_RESPONSE"
            exit 1
          fi
          echo "Deployment ID: $DEPLOYMENT_ID"

          # Check deployment status
          echo "Checking deployment status..."
          STATUS_RESPONSE=$(curl -X POST "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID" \
            -H "Authorization: Bearer ${BEARER_TOKEN}" -H "Content-Type: application/json")

          echo "Deployment status: $STATUS_RESPONSE"
          echo "✅ Deployment completed (staged). Visit https://central.sonatype.com/ to publish."

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The tag was verified upstream (signature + anchors the built commit)
          # before any upload. Create the release only after a successful stage,
          # so no release object exists for a deployment that failed to upload.
          VERSION=$(xmlstarlet sel -t -v "/_:project/_:version" pom.xml)
          TAG_NAME="v$VERSION"
          gh release create "$TAG_NAME" \
            --title "Release $VERSION" \
            --notes "Release $VERSION deployed to Maven Central (staged)" \
            --verify-tag

      - name: Clean up
        if: always()
        run: |
          set +e  # Don't fail on cleanup errors
          rm -f "$HOME/.m2/settings.xml" 2>/dev/null
          rm -rf /tmp/maven-release 2>/dev/null
          rm -rf /tmp/maven-deployment-contents 2>/dev/null
          # Kill any lingering gpg-agent processes (defensive)
          pkill -u "$(id -u)" gpg-agent 2>/dev/null || true
          echo "✅ Cleanup completed"
