###############################################################
# Pull-request build workflow.
#
# Builds and tests only. Deliberately references NO secrets, so
# runs triggered by fork PRs are safe by construction; the
# signing and bundle-staging pipeline lives in ci-build.yml,
# which runs only on pushes to main.
###############################################################

name: PR build

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and run tests
        run: mvn -B -ntp clean verify
